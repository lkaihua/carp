name: Build and release

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
          npm run build
      - name: Test Go backend
        working-directory: backend
        run: go test ./...
      - name: Test embedded frontend
        run: |
          mkdir -p backend/src/packages/frontend/dist
          cp -R frontend/dist/. backend/src/packages/frontend/dist/
          (cd backend && go test -tags carp_release ./...)

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build release packages
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/$GITHUB_REF_NAME"/*.zip \
            "release/$GITHUB_REF_NAME"/*.tar.gz \
            "release/$GITHUB_REF_NAME/SHA256SUMS" \
            --verify-tag --generate-notes
